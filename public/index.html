<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zeldas</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/htmx.min.js" defer></script>
    <script src="/vendor/alpine.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body
    x-data="{ linkModal: false, catModal: false, confirmOpen: false, confirmId: null,
      palette: [10, 40, 70, 110, 150, 190, 220, 260, 300, 340], linkColor: 10,
      resetLinkForm() {
        this.linkColor = this.palette[Math.floor(Math.random() * this.palette.length)];
        const f = document.getElementById('link-form');
        if (f) f.reset();
        const cb = document.getElementById('cat-checkboxes');
        if (cb) cb.querySelectorAll('input[type=checkbox]').forEach((c) => (c.checked = false));
      },
      openLink() { this.resetLinkForm(); this.linkModal = true; },
      openDelete(id) { this.confirmId = id; this.confirmOpen = true; },
      doDelete() { if (this.confirmId != null) htmx.ajax('DELETE', '/api/links/' + this.confirmId, { swap: 'none' }); this.confirmOpen = false; } }"
  >
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg>
        </span>
        <h1>zeldas</h1>
      </div>
      <div class="actions">
        <button class="btn btn-primary" @click="openLink()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          Link
        </button>
        <button class="btn btn-ghost" @click="catModal = true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          Category
        </button>
      </div>
    </header>

    <form id="controls" class="controls">
      <div class="search-wrap">
        <svg class="icon search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input
          type="search"
          name="search"
          placeholder="Search links…"
          aria-label="Search links"
        />
      </div>

      <div class="segmented" role="group" aria-label="Sort order">
        <label class="seg">
          <input type="radio" name="sort" value="random" checked />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
          <span>Random</span>
        </label>
        <label class="seg">
          <input type="radio" name="sort" value="date" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          <span>By date</span>
        </label>
        <label class="seg">
          <input type="radio" name="sort" value="category" />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          <span>By category</span>
        </label>
      </div>

      <div class="select-wrap">
        <svg class="icon select-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
        <select
          name="category"
          aria-label="Filter by category"
          hx-get="/api/categories/options"
          hx-trigger="load, refresh-categories from:body"
          hx-swap="innerHTML"
        >
          <option value="all">All categories</option>
        </select>
        <svg class="icon select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </form>

    <main>
      <div
        id="grid"
        hx-get="/api/links"
        hx-include="#controls"
        hx-trigger="load, input delay:300ms from:#controls, change from:#controls"
        hx-swap="innerHTML"
      >
        Loading…
      </div>
    </main>

    <!-- Add link modal -->
    <div
      class="modal-backdrop"
      x-show="linkModal"
      x-cloak
      @click.self="linkModal = false"
      @zeldas-link-added.window="resetLinkForm(); linkModal = false"
    >
      <div class="modal">
        <div class="modal-head">
          <h2>Add link</h2>
          <button type="button" class="icon-btn" @click="linkModal = false" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <form
          id="link-form"
          hx-post="/api/links"
          hx-swap="none"
          hx-include="#cat-checkboxes"
        >
          <label class="field">
            <span>URL</span>
            <input type="url" name="url" required placeholder="https://…" />
          </label>
          <label class="field">
            <span>Description</span>
            <textarea name="description" rows="2" placeholder="optional"></textarea>
          </label>
          <label class="field">
            <span>Color</span>
            <div class="swatches">
              <template x-for="hue in palette" :key="hue">
                <button
                  type="button"
                  class="swatch"
                  :style="`background:hsl(${hue} 72% 86%);border-color:hsl(${hue} 55% 70%)`"
                  :class="{ active: linkColor === hue }"
                  @click="linkColor = hue"
                  :aria-label="`Choose color ${hue}`"
                ></button>
              </template>
            </div>
          </label>
          <input type="hidden" name="color" :value="linkColor" />
        </form>

        <div class="cat-section">
          <p class="label">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            Categories
          </p>
          <div
            id="cat-checkboxes"
            hx-get="/api/categories/checkboxes"
            hx-trigger="load, refresh-categories from:body"
            hx-swap="innerHTML"
          ></div>
          <form
            id="inline-cat-form"
            class="inline-cat"
            hx-post="/api/categories"
            hx-swap="none"
            hx-on::after-request="if(event.detail.successful) this.reset()"
          >
            <input type="text" name="name" placeholder="new category" />
            <button type="submit" class="btn btn-ghost">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
              Add
            </button>
          </form>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" @click="linkModal = false">Cancel</button>
          <button type="submit" class="btn btn-primary" form="link-form">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Add category modal -->
    <div
      class="modal-backdrop"
      x-show="catModal"
      x-cloak
      @click.self="catModal = false"
      @zeldas-cat-added.window="catModal = false; document.getElementById('cat-form')?.reset()"
    >
      <div class="modal">
        <div class="modal-head">
          <h2>Add category</h2>
          <button type="button" class="icon-btn" @click="catModal = false" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
          <form
            id="cat-form"
            hx-post="/api/categories"
            hx-swap="none"
          >
            <label class="field">
              <span>Name</span>
              <input type="text" name="name" required />
            </label>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" @click="catModal = false">Cancel</button>
              <button type="submit" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Delete confirmation modal -->
    <div
      class="modal-backdrop"
      x-show="confirmOpen"
      x-cloak
      @click.self="confirmOpen = false"
      @keydown.escape.window="confirmOpen = false"
    >
      <div class="modal confirm">
        <div class="modal-head">
          <h2>Delete link?</h2>
          <button type="button" class="icon-btn" @click="confirmOpen = false" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <p class="confirm-text">
          This link will be permanently removed. This action cannot be undone.
        </p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" @click="confirmOpen = false">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" @click="doDelete()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            Delete
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
